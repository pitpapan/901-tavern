      "name": "帝国",
      "uid": 105304581,
      "book": "政治与势力",
      "type": "faction",
      "path": "entries/02_政治与势力/105304581_帝国.txt",
      "abstract": "帝国是长期统治飘零大陆的政权，最高统治者被称为“帝”。帝以集中的最高权威统合军政事务，并将非敌对的精灵、矮人等族纳入帝国。帝国没有贵族阶级，官僚不因任职而被视为比普通人更高贵；与此同时，帝、八柱将及名人享有显著的个人威望，财富、职权和居民生活处境仍有差异。帝国不提倡宗教，仍有圣庙",
