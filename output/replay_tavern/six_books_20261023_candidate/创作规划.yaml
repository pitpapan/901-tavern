      "path": "entries/01_世界基础设定/101964920_妄想山脉.txt",
      "abstract": "妄想山脉是妄想大陆“四陆一脉”中的山脉，按四片大陆所在区域划分，各区域栖居的怪物不同。飘零大陆一侧有魔兽部族与龙族活动，帝国边境关卡曾把成军魔兽限制在山脉中；山脉最中央另有独立、隔绝而广阔的无法地带。山中还分布着部族居处、洞窟、地下通道、天险和多处秘境。",
