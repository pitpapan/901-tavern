    {
      "name": "大陆法则限制",
      "uid": 33383795,
      "book": "世界基础设定",
      "type": "concept",
      "path": "entries/01_世界基础设定/33383795_大陆法则限制.txt",
      "abstract": "大陆法则限制是不同大陆之间对器物与力量运行的约束。科技大陆的手枪在飘零大陆不能生效；采用魔导技术制造、外形近似手枪的器物，因为运行原理不同，可以在飘零使用。技能和技巧本身不受这一类限制，因此跨大陆后是否可用，要区别器物或力量的作用原理与使用者掌握的技艺。",
