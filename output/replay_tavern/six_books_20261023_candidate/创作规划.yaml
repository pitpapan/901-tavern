      "abstract": "妄想大陆是整个世界的称呼。这个世界同时存在科技、魔法、剑气、斗气、魔兽及异世界生物，地域总体分为“四陆一脉”：四片大陆以及按各大陆区域划分的妄想山脉。不同大陆有各自的法则，某一大陆能够使用的器物或力量，到了另一大陆可能失效。",
