      "path": "entries/02_政治与势力/81980241_兄弟会.txt",
      "abstract": "兄弟会是帝直接掌控的秘密组织，以守护大陆为口号，在暗中从事情报收集、谍报和暗杀。组织严格挑选成员，并采用与上线单线联系的管理方式；一旦失去上线，成员往往难以证明自己的身份，但受选者即使脱离联系，仍会按照兄弟会的标准行动。帝未向八柱将公开兄弟会的真实面目。",
