      "path": "entries/01_世界基础设定/214748319_飘零大陆.txt",
      "abstract": "飘零大陆是妄想大陆世界的四片大陆之一，帝国长期在此统治，并整合了非敌对的精灵、矮人等族。帝国以帝为政治中心，既有城市、村镇、学术机构与工坊，也有面向妄想山脉的边境防线。过去边境关卡阻止山脉魔兽大军深入大陆，长期的和平与富裕建立在帝国治理和边防之上。",
