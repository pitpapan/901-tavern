<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>901 冰霜实际加载验收</title>
<style>body{max-width:900px;margin:40px auto;background:#18212b;color:#edf3f8;font:17px/1.7 system-ui;padding:24px}button{padding:14px 22px;font:inherit}pre{white-space:pre-wrap;overflow-wrap:anywhere}small{color:#b4c7d7}.ok{color:#9ae6b4}</style>
<h1>901 冰霜实际加载验收</h1>
<p>非 Canon、仅内存隔离夹具。直接加载本端口已安装模块，不调用叙事模型，不读写聊天、设置或存档。固定骰只隔离攻击随机性，费用和结果由实际规则程序计算。</p>
<p id="origin"></p><button id="run">运行两项验收</button><pre id="result">等待手动运行。</pre>
<details><summary>已加载模块与 SHA-256</summary><pre id="modules"></pre></details>
<script type="module">
const base='./work/rules_engine/', output=document.querySelector('#result');
document.querySelector('#origin').textContent='当前服务：'+location.origin;
const files=['staged-bundle.mjs','gm_runtime/resource-program.mjs','rule-contracts.mjs','resource-data.mjs','resource-action-index.mjs','gm_runtime/narrative.mjs','combat/presentation.mjs'];
const check=(condition,message)=>{if(!condition)throw Error(message)};
document.querySelector('#run').onclick=async()=>{
 document.querySelector('#run').disabled=true;output.textContent='正在从当前端口加载真实模块…';
 try{
  const [{RESOURCE_DEFINITIONS:definitions},{createOpeningRoster},{purchaseLearning},{claimLearningGrant},{reduceRuleAction}]=await Promise.all([
   import(base+'resource-definitions.mjs'),import(base+'combat/opening.mjs'),import(base+'growth-pricing.mjs'),import(base+'resource-acquisition.mjs'),import(base+'gm_runtime/rule-actions.mjs')]);
  await Promise.all([import(base+'resource-action-index.mjs'),import(base+'gm_runtime/narrative.mjs'),import(base+'combat/presentation.mjs')]);
  const hashes=[];for(const file of files){const response=await fetch(base+file,{cache:'no-store'});check(response.ok,file+'加载失败');const digest=await crypto.subtle.digest('SHA-256',await response.arrayBuffer());hashes.push(file+'\n'+Array.from(new Uint8Array(digest),b=>b.toString(16).padStart(2,'0')).join(''));}
  document.querySelector('#modules').textContent=hashes.join('\n\n');
  const id='candidate-901-magic-bundle-ba577210e69dafd5',source='隔离浏览器验收／非Canon授学',spell='imperial-magic:D:寒冰箭';
  const offer=(grade,choices)=>({id:'mage-'+grade,resourceId:id,name:'法师·冰霜',kind:'acquisition',grade,baseCost:grade==='D'?15:35,adopted:true,source,actorIds:['player'],requirementsMet:true,contractVersion:definitions[id].contractVersion,acquisitionChoices:choices});
  let state=createOpeningRoster().player.state;state.xp=100;
  state=purchaseLearning(state,offer('D',{specialization:'冰霜',pool:'精神魔力',initialCurrent:0}),{actorId:'player'}).state;
  const dMax=state.resources.精神魔力.max;
  claimLearningGrant(state,id+'/D/gift',[spell],definitions,source);
  state=purchaseLearning(state,offer('C',{}),{actorId:'player'}).state;
  const cMax=state.resources.精神魔力.max;
  check(dMax===2&&cMax===dMax,'冰霜进阶容量不符：'+dMax+' → '+cMax);
  claimLearningGrant(state,id+'/C/gift',[spell],definitions,source);
  state.resources.精神魔力.current=2;state.skills.神秘={level:3,subs:{塑能:{level:1}}};
  const actors=createOpeningRoster();actors.player.state=state;
  const plan={source,grade:'C',targetIds:['huang'],distance:1,effectLine:true,precise:true,components:{posture:true,language:true,focus:true}};
  const root={actors,ruleScene:{objects:{spell:{type:'kitResource',resourceId:spell,source,actorIds:['player'],plans:{use:plan}}}}};
  const request={kind:'rule',action:'mechanism',actorId:'player',objectId:'spell',operation:'cast',part:'use'},dice={drawDice:()=>Array(200).fill(8)};
  const before=JSON.stringify(root),actual=reduceRuleAction(root,request,dice);
  check(JSON.stringify(root)===before,'执行修改了输入夹具');
  const remaining=actual.actors.player.state.resources.精神魔力.current;
  check(actual.result.cost===2&&remaining===0,'减耗或余额不符');
  // The same real spell without the specialization demonstrates its actual base price.
  const plain=structuredClone(root);delete plain.actors.player.state.learnedResources[id];
  plain.actors.player.state.casting={imperial:{grade:'C',pool:'精神魔力'}};
  delete plain.actors.player.state.learnedResources[spell].casterSource;
  plain.actors.player.state.resources.精神魔力={...plain.actors.player.state.resources.精神魔力,max:3,current:3};
  const baseline=reduceRuleAction(plain,request,dice);check(baseline.result.cost===3,'法术原价不是3');
  const insufficient=structuredClone(root);insufficient.actors.player.state.resources.精神魔力.current=1;
  const poorBefore=JSON.stringify(insufficient);let rejected=false;
  try{reduceRuleAction(insufficient,request,dice)}catch(e){check(e.message.includes('施法能量不足'),e.message);rejected=true;}
  check(rejected&&JSON.stringify(insufficient)===poorBefore,'不足额保护失败');
  output.className='ok';output.textContent='PASS — 2 / 2\n\n第3项：冰霜 D → C\nD阶上限：'+dMax+'；C阶上限：'+cMax+'。没有误领奥术＋10。\n\n第4项：C级寒冰箭实际施放\n无冰霜原价：'+baseline.result.cost+'；有冰霜实际支付：'+actual.result.cost+'。\n初始余额：2；施放后余额：'+remaining+'。成功执行。\n余额只有1时：拒绝施放，输入状态未改写。\n\n7个配套模块均从当前服务加载。无模型请求、无持久化写入。';
 }catch(e){output.className='';output.textContent='FAIL\n'+e.stack;}
 finally{document.querySelector('#run').disabled=false;}
};
</script></html>
